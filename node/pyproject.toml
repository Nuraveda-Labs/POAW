[project]
name = "poaw-node"
version = "0.1.0"
description = "Proof of Agent Work reference node: claims API, verifier runner, receipts, Merkle log."
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "poaw-core",
  "fastapi>=0.115,<1",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.scripts]
poaw-node = "poaw_node.cli:main"

[project.optional-dependencies]
anchor = ["rlp>=4", "eth-abi>=5", "eth-keys>=0.5", "eth-hash[pycryptodome]>=0.7", "cryptography>=43"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "respx>=0.21", "jsonschema>=4.23", "poaw-node[anchor]"]

[tool.uv.sources]
poaw-core = { path = "../core-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poaw_node"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
